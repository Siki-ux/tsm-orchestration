name: Build & Publish Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (defaults to 'latest')"
        required: false
        default: latest

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: init
            context: ./init
            dockerfile: ./init/Dockerfile
            image: ghcr.io/${{ github.repository }}/init
          - name: frost
            context: ./tomcat
            dockerfile: ./tomcat/Dockerfile
            image: ghcr.io/${{ github.repository }}/frost
          - name: configdb-updater
            context: .
            dockerfile: ./configdb_updater/Dockerfile
            image: ghcr.io/${{ github.repository }}/configdb-updater
          - name: dispatcher
            context: .
            dockerfile: ./dispatcher/Dockerfile
            image: ghcr.io/${{ github.repository }}/dispatcher
          - name: cron-scheduler
            context: .
            dockerfile: ./cron/Dockerfile
            image: ghcr.io/${{ github.repository }}/cron-scheduler
          - name: keycloak
            context: ./keycloak
            dockerfile: ./keycloak/Dockerfile
            image: ghcr.io/${{ github.repository }}/keycloak
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
